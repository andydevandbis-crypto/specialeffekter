<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Special Effects</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    background:
        radial-gradient(circle at top, #2b0000 0%, #100000 35%, #050505 75%);
    color: #f5f5f5;
    font-family: Georgia, "Times New Roman", serif;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    overflow-x: hidden;
}

.menu {
    width: 100%;
    max-width: 520px;
    min-height: 100vh;
    padding: 45px 22px 35px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.top-line {
    width: 75%;
    height: 1px;
    background: linear-gradient(
        to right,
        transparent,
        #c9a227,
        transparent
    );
    margin-bottom: 25px;
}

.title {
    text-align: center;
    margin-bottom: 8px;
}

.title .icon {
    font-size: 48px;
    display: block;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 8px rgba(201,162,39,0.35));
}

.title h1 {
    margin: 0;
    font-size: 34px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #f4e6b0;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
}

.subtitle {
    margin-top: 10px;
    margin-bottom: 38px;
    font-size: 15px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: #a88722;
}

.menu-button {
    width: 100%;
    min-height: 135px;
    margin: 10px 0;

    border: 1px solid #6d5616;
    border-radius: 8px;

    background:
        linear-gradient(
            145deg,
            rgba(55,55,55,0.9),
            rgba(17,17,17,0.98)
        );

    color: white;
    text-decoration: none;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 22px;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.05);

    transition: transform 0.15s ease,
                border-color 0.15s ease,
                background 0.15s ease;
}

.menu-button:active {
    transform: scale(0.97);
}

.menu-button:hover {
    border-color: #c9a227;

    background:
        linear-gradient(
            145deg,
            rgba(70,15,15,0.95),
            rgba(20,5,5,0.98)
        );
}

.button-icon {
    font-size: 52px;
    line-height: 1;
}

.button-text {
    text-align: left;
}

.button-title {
    display: block;
    font-size: 28px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #f5f5f5;
}

.button-subtitle {
    display: block;
    margin-top: 7px;
    font-size: 13px;
    letter-spacing: 2px;
    color: #a88722;
    text-transform: uppercase;
}

.divider {
    width: 55%;
    height: 1px;
    background: linear-gradient(
        to right,
        transparent,
        #6d5616,
        transparent
    );
    margin: 30px 0 20px;
}

.footer {
    color: #555;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
}

@media (max-width: 480px) {

    .menu {
        padding: 35px 18px 25px;
    }

    .title .icon {
        font-size: 42px;
    }

    .title h1 {
        font-size: 29px;
        letter-spacing: 2px;
    }

    .subtitle {
        font-size: 12px;
        letter-spacing: 4px;
        margin-bottom: 30px;
    }

    .menu-button {
        min-height: 125px;
        gap: 17px;
    }

    .button-icon {
        font-size: 45px;
    }

    .button-title {
        font-size: 24px;
    }

    .button-subtitle {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div class="menu">

    <div class="top-line"></div>

    <div class="title">
        <span class="icon">🎩</span>
        <h1>Special Effects</h1>
    </div>

    <div class="subtitle">
        Mafia Edition
    </div>

    <!-- POLIS -->
    <a class="menu-button" href="police.html">

        <span class="button-icon">🚓</span>

        <span class="button-text">
            <span class="button-title">Polis</span>
            <span class="button-subtitle">
                Polisbil &amp; Siren
            </span>
        </span>

    </a>

    <!-- VAPEN -->
    <a class="menu-button" href="weapons.html">

        <span class="button-icon">🔫</span>

        <span class="button-text">
            <span class="button-title">Vapen</span>
            <span class="button-subtitle">
                Vapen Effekter
            </span>
        </span>

    </a>

    <div class="divider"></div>

    <div class="footer">
        Special Effects
    </div>

</div>

</body>
</html>
